          type: array
          items:
            $ref: '#/components/schemas/Invite'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    PagedClients:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Client'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    PagedProjects:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
    PagedRequests:
      type: object
      properties:
        items:
          type: array
